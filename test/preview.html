<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism — Card Preview</title>
<style>
  /* Prism design tokens (mirrors themes/prism.yaml) applied at :root so the
     shadow-DOM cards pick them up exactly as they would under the HA theme. */
  :root {
    --prism-radius: 18px; --prism-gap: 16px; --prism-shadow: none;
    --prism-accent: #3aa0e8;
    --prism-surface: #ffffff; --prism-surface-2: #f1f4f6;
    --prism-text-primary: #15181a; --prism-text-secondary: #6b7280;
    --prism-border: rgba(20,24,27,.08);
    --prism-good: #3aa76d; --prism-warn: #e0922e; --prism-bad: #c64b4b;
    --paper-font-body1_-_font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  body.dark {
    --prism-accent: #4aa9ee;
    --prism-surface: #16191c; --prism-surface-2: #1e2226;
    --prism-text-primary: #eef1f3; --prism-text-secondary: #98a0a6;
    --prism-border: rgba(255,255,255,.09);
    --prism-good: #43b97b; --prism-warn: #e6a03f; --prism-bad: #d76161;
    color-scheme: dark;
  }
  body {
    margin: 0; padding: 28px; font-family: var(--paper-font-body1_-_font-family);
    background: var(--prism-surface-2);
    transition: background .2s;
  }
  body.dark { background: #0e1113; }
  h1 { font-size: 18px; color: var(--prism-text-primary); margin: 0 0 4px; }
  p  { color: var(--prism-text-secondary); margin: 0 0 20px; font-size: 13px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  button {
    font: 500 13px/1 var(--paper-font-body1_-_font-family); cursor: pointer;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--prism-border);
    background: var(--prism-surface); color: var(--prism-text-primary);
  }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    max-width: 1100px;
  }
  .wide { grid-column: 1 / -1; }
  /* Minimal stub for ha-icon so cards lay out (no MDI font here). */
  ha-icon { display: inline-block; width: 20px; height: 20px; border-radius: 5px;
            background: currentColor; opacity: .85; }
</style>
</head>
<body>
  <h1>Prism — Card Preview</h1>
  <p>Offline mock (fake states + history). Toggle theme and accent to sanity-check both modes.</p>
  <div class="toolbar">
    <button id="theme">Toggle light / dark</button>
    <button data-accent="#3aa0e8">Blue</button>
    <button data-accent="#2fa36a">Emerald</button>
    <button data-accent="#e0922e">Amber</button>
    <button data-accent="#7c62d6">Violet</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    // ── Mock hass ────────────────────────────────────────────────────
    const now = Date.now();
    function walk(base, spread, n) {
      const pts = []; let v = base;
      for (let i = 0; i < n; i++) {
        v += (Math.random() - 0.5) * spread;
        pts.push({ s: v.toFixed(2), lu: (now / 1000) - (n - i) * 300 });
      }
      return pts;
    }
    const HIST = {
      'sensor.house_power': walk(650, 180, 120),
      'sensor.grid_power': walk(1200, 400, 120),
      'sensor.grid_net': walk(0, 900, 120),
      'sensor.battery_soc': walk(64, 6, 120),
      'sensor.cpu_temperature': walk(58, 8, 120),
      'sensor.energy_today': walk(12, 1.2, 120),
      'sensor.humidity': walk(52, 4, 120),
    };
    const hass = {
      themes: { darkMode: false },
      states: {
        'sensor.house_power':    { state: '712',  attributes: { friendly_name: 'House Power', unit_of_measurement: 'W' } },
        'sensor.grid_power':     { state: '1340', attributes: { friendly_name: 'Grid Power', unit_of_measurement: 'W' } },
        'sensor.grid_net':       { state: '-820', attributes: { friendly_name: 'Grid Net', unit_of_measurement: 'W' } },
        'sensor.battery_soc':    { state: '64',   attributes: { friendly_name: 'Battery', unit_of_measurement: '%' } },
        'sensor.cpu_temperature':{ state: '58',   attributes: { friendly_name: 'CPU Temp', unit_of_measurement: '°C' } },
        'sensor.energy_today':   { state: '12.4', attributes: { friendly_name: 'Energy Today', unit_of_measurement: 'kWh' } },
        'sensor.humidity':       { state: '52',   attributes: { friendly_name: 'Humidity', unit_of_measurement: '%' } },
        'sensor.circuit_hvac':   { state: '1840', attributes: { friendly_name: 'HVAC', unit_of_measurement: 'W' } },
        'sensor.circuit_kitchen':{ state: '920',  attributes: { friendly_name: 'Kitchen', unit_of_measurement: 'W' } },
        'sensor.circuit_ev':     { state: '3200', attributes: { friendly_name: 'EV Charger', unit_of_measurement: 'W' } },
        'sensor.circuit_lights': { state: '260',  attributes: { friendly_name: 'Lighting', unit_of_measurement: 'W' } },
        'light.living_room':     { state: 'on',   attributes: { friendly_name: 'Living Room', icon: 'mdi:sofa' }, last_changed: new Date(now - 8 * 60000).toISOString() },
        'switch.coffee':         { state: 'off',  attributes: { friendly_name: 'Coffee Maker' }, last_changed: new Date(now - 3 * 3600000).toISOString() },
        'binary_sensor.door':    { state: 'off',  attributes: { friendly_name: 'Front Door', device_class: 'door' }, last_changed: new Date(now - 42 * 60000).toISOString() },
        'sensor.lr_temperature': { state: '21.4', attributes: { friendly_name: 'Living Room Temperature', unit_of_measurement: '°C', device_class: 'temperature' }, last_changed: new Date(now - 5 * 60000).toISOString() },
        'sensor.lr_humidity':    { state: '48',   attributes: { friendly_name: 'Living Room Humidity', unit_of_measurement: '%', device_class: 'humidity' } },
        'light.desk':            { state: 'on',   attributes: { friendly_name: 'Desk Lamp', icon: 'mdi:desk-lamp', brightness: 178, supported_color_modes: ['rgb'], rgb_color: [255, 160, 70] } },
        'climate.living_room':   { state: 'heat', attributes: { friendly_name: 'Living Room', temperature: 21, current_temperature: 19.5, hvac_action: 'heating', min_temp: 7, max_temp: 35, target_temp_step: 0.5 } },
        'cover.blinds':          { state: 'open', attributes: { friendly_name: 'Blinds', current_position: 70, supported_features: 15 } },
        'media_player.speaker':  { state: 'playing', attributes: { friendly_name: 'Speaker', media_title: 'Midnight City', media_artist: 'M83', volume_level: 0.4, supported_features: 16437 } },
        'weather.home':          { state: 'partlycloudy', attributes: { friendly_name: 'Home', temperature: 18, apparent_temperature: 16, temperature_unit: '°C', humidity: 62, pressure: 1013, pressure_unit: 'hPa', wind_speed: 24, wind_bearing: 315, wind_gust_speed: 41, wind_speed_unit: 'km/h' } },
        'sun.sun':               { state: 'above_horizon', attributes: { friendly_name: 'Sun', next_rising: (() => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(6, 12, 0, 0); return d.toISOString(); })(), next_setting: (() => { const d = new Date(); d.setHours(20, 24, 0, 0); return d.toISOString(); })(), elevation: 38, azimuth: 232 } },
      },
      config: { unit_system: { temperature: '°C' } },
      // Frontend registries (for area-name lookups).
      areas: {
        living_room: { area_id: 'living_room', name: 'Living Room' },
        study: { area_id: 'study', name: 'Study' },
      },
      entities: {
        'light.living_room': { area_id: 'living_room' },
        'light.desk': { area_id: 'study' },
        'sensor.lr_temperature': { area_id: 'living_room' },
        'sensor.lr_humidity': { area_id: 'living_room' },
      },
      devices: {},
      callWS(msg) {
        if (msg && msg.service === 'get_forecasts') {
          const wid = (msg.target && msg.target.entity_id) || 'weather.home';
          const n = Date.now(), day = 86400000, hr = 3600000;
          const daily = [
            { condition: 'partlycloudy', temperature: 21, templow: 9, precipitation_probability: 10 },
            { condition: 'sunny', temperature: 23, templow: 10, precipitation_probability: 0 },
            { condition: 'rainy', temperature: 16, templow: 11, precipitation_probability: 80 },
            { condition: 'pouring', temperature: 15, templow: 10, precipitation_probability: 95 },
            { condition: 'cloudy', temperature: 18, templow: 8, precipitation_probability: 30 },
            { condition: 'snowy', temperature: 3, templow: -2, precipitation_probability: 70 },
            { condition: 'lightning-rainy', temperature: 19, templow: 12, precipitation_probability: 60 },
          ].map((f, i) => ({ ...f, datetime: new Date(n + i * day).toISOString() }));
          const hourly = ['partlycloudy', 'partlycloudy', 'cloudy', 'rainy', 'rainy', 'cloudy', 'clear-night', 'clear-night']
            .map((cnd, i) => ({ condition: cnd, temperature: 20 - i, precipitation_probability: i > 2 && i < 5 ? 70 : 10, datetime: new Date(n + i * hr).toISOString() }));
          return Promise.resolve({ response: { [wid]: { forecast: msg.service_data && msg.service_data.type === 'hourly' ? hourly : daily } } });
        }
        const id = msg.entity_ids ? msg.entity_ids[0] : null;
        return Promise.resolve({ [id]: HIST[id] || [] });
      },
      callService(domain, service, data) {
        // Optimistic state changes so the preview feels live.
        const id = data && data.entity_id;
        if (!id || !hass.states[id]) return Promise.resolve();
        const cur = hass.states[id];
        let next = null;
        if (service === 'toggle') next = { state: cur.state === 'on' ? 'off' : 'on' };
        else if (service === 'turn_off') next = { state: 'off' };
        else if (service === 'turn_on') {
          const attrs = { ...cur.attributes };
          if (data.brightness_pct != null) attrs.brightness = Math.round((data.brightness_pct / 100) * 255);
          next = { state: 'on', attributes: attrs };
        }
        else if (service === 'set_temperature') next = { attributes: { ...cur.attributes, temperature: data.temperature } };
        else if (service === 'set_cover_position') next = { attributes: { ...cur.attributes, current_position: data.position }, state: data.position === 0 ? 'closed' : 'open' };
        else if (service === 'open_cover') next = { state: 'open', attributes: { ...cur.attributes, current_position: 100 } };
        else if (service === 'close_cover') next = { state: 'closed', attributes: { ...cur.attributes, current_position: 0 } };
        else if (service === 'media_play_pause') next = { state: cur.state === 'playing' ? 'paused' : 'playing' };
        else if (service === 'volume_set') next = { attributes: { ...cur.attributes, volume_level: data.volume_level } };
        if (next) {
          hass.states[id] = { ...cur, ...next, attributes: next.attributes || cur.attributes, last_changed: new Date().toISOString() };
          build();
        }
        return Promise.resolve();
      },
    };

    const CARDS = [
      { type: 'prism-stat-card', cfg: { entity: 'sensor.house_power', icon: 'mdi:flash', sparkline: true, trend: true, accent: 'blue' } },
      { type: 'prism-stat-card', cfg: { entity: 'sensor.energy_today', icon: 'mdi:lightning-bolt', decimals: 1, trend: true, accent: 'amber' } },
      { type: 'prism-gauge-card', cfg: { entity: 'sensor.battery_soc', min: 0, max: 100, style: 'fill', segments: [{from:0,color:'red'},{from:20,color:'amber'},{from:50,color:'green'}] } },
      { type: 'prism-gauge-card', cfg: { entity: 'sensor.cpu_temperature', min: 20, max: 90, style: 'bands', segments: [{from:20,color:'green'},{from:65,color:'amber'},{from:80,color:'red'}] } },
      { type: 'prism-power-card', cfg: { entity: 'sensor.house_power', icon: 'mdi:home-lightning-bolt', mode: 'load', hours: 3, peak: true, sparkline: true, energy_entity: 'sensor.energy_today', energy_label: 'Today', accent: 'amber' } },
      { type: 'prism-power-card', cfg: { entity: 'sensor.grid_net', icon: 'mdi:transmission-tower', mode: 'grid', hours: 3, peak: true, sparkline: true, accent: 'teal' } },
      { type: 'prism-linear-gauge-card', cfg: { entity: 'sensor.humidity', name: 'Humidity', icon: 'mdi:water-percent', min: 0, max: 100, style: 'fill', segments: [{from:0,color:'amber'},{from:35,color:'green'},{from:65,color:'blue'}] } },
      { type: 'prism-linear-gauge-card', cfg: { entity: 'sensor.cpu_temperature', name: 'CPU Temp', min: 20, max: 90, style: 'bands', segments: [{from:20,color:'green'},{from:65,color:'amber'},{from:80,color:'red'}] } },
      { type: 'prism-bar-card', cfg: { title: 'Power by circuit', entities: ['sensor.circuit_ev','sensor.circuit_hvac','sensor.circuit_kitchen','sensor.circuit_lights'], unit: 'W', sort: true, accent: 'blue', segments: [{from:0,color:'green'},{from:1500,color:'amber'},{from:3000,color:'red'}] }, wide: true },
      { type: 'prism-entities-card', cfg: { title: 'Living Room', secondary: 'last-changed', accent: 'amber', entities: [
        'light.living_room',
        'switch.coffee',
        { entity: 'binary_sensor.door', icon: 'mdi:door' },
        { entity: 'sensor.lr_temperature', use_area: true, icon: 'mdi:thermometer', secondary: 'sensor.lr_humidity' },
        { entity: 'sensor.house_power', name: 'Power', icon: 'mdi:flash' },
      ] } },
      { type: 'prism-filter-card', cfg: { title: 'Lights on', domain: 'light', condition: 'on', accent: 'amber', secondary: 'area' } },
      { type: 'prism-filter-card', cfg: { title: 'Lights on', domain: 'light', condition: 'on', layout: 'chips', accent: 'amber' } },
      { type: 'prism-filter-card', cfg: { title: 'Lights by area', domain: 'light', condition: 'on', group_by: 'area', accent: 'amber' } },
      { type: 'prism-switch-card', cfg: { entity: 'switch.coffee', name: 'Coffee Maker', icon: 'mdi:coffee', accent: 'orange', secondary: 'state' } },
      { type: 'prism-light-card', cfg: { entity: 'light.desk', name: 'Desk Lamp', title: 'Study' } },
      { type: 'prism-light-card', cfg: { entity: 'light.living_room', name: 'Living Room', accent: 'amber' } },
      { type: 'prism-climate-card', cfg: { entity: 'climate.living_room', name: 'Thermostat' } },
      { type: 'prism-cover-card', cfg: { entity: 'cover.blinds', name: 'Blinds' } },
      { type: 'prism-media-card', cfg: { entity: 'media_player.speaker', title: 'Now Playing' }, wide: true },
      { type: 'prism-wind-card', cfg: { entity: 'weather.home', title: 'Wind', accent: 'teal' } },
      { type: 'prism-weather-card', cfg: { entity: 'weather.home', title: 'Weather', accent: 'blue' } },
      { type: 'prism-forecast-card', cfg: { entity: 'weather.home', title: 'Forecast', type: 'daily', count: 7, accent: 'blue' }, wide: true },
      { type: 'prism-sun-card', cfg: { entity: 'sun.sun', title: 'Sun', accent: 'amber' } },
      { type: 'prism-sparkline-card', cfg: { entity: 'sensor.grid_power', hours: 24, style: 'area', show_minmax: true, accent: 'teal' }, wide: true },
      { type: 'prism-sparkline-card', cfg: { entity: 'sensor.house_power', hours: 24, style: 'line', accent: 'blue' }, wide: true },
    ];

    function build() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (const c of CARDS) {
        const el = document.createElement(c.type);
        el.setConfig(c.cfg);
        el.hass = hass;
        if (c.wide) el.classList.add('wide');
        grid.appendChild(el);
      }
    }

    document.getElementById('theme').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      hass.themes.darkMode = document.body.classList.contains('dark');
      build();
    });
    document.querySelectorAll('[data-accent]').forEach((b) =>
      b.addEventListener('click', () => {
        document.documentElement.style.setProperty('--prism-accent', b.dataset.accent);
      })
    );

    // Load the bundle, then render.
    const s = document.createElement('script');
    s.src = '../prism.js';
    s.onload = build;
    document.head.appendChild(s);
  </script>
</body>
</html>
